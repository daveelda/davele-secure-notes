[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # The Supabase publishable (anon) key is designed to be public and is
  # intentionally inlined into the client bundle by Next.js (NEXT_PUBLIC_*).
  # Exclude it from secrets scanning so the build doesn't fail on it.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
