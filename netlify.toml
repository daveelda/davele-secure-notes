[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # The Supabase URL and publishable (anon) key are designed to be public and are
  # intentionally inlined into the client bundle by Next.js (NEXT_PUBLIC_*).
  # Exclude them from secrets scanning so the build doesn't fail on them.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_URL"
